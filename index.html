<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纹样演化互动展</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div style="text-align: right; max-width: 640px; margin: 0 auto; padding: 10px 20px;">
        <button onclick="readPageContent()">🔊 开始朗读</button>
        <button onclick="stopReading()">🔇 停止朗读</button>
    </div>

    <div class="container">
        <header id="selection-header">
            <h1>🎨 传统纹样的现代演化</h1>
            <p>点击选择一种现代风格，查看古代瑞兽纹样在不同设计理念下的重生。</p>
            
            <div class="original-motif">
                <img id="landing-img" src="" alt="纹样展示图"> 
                
                <div class="video-container" style="margin-top: 15px; text-align: center;">
                    <button id="ai-video-btn" class="video-trigger-btn" onclick="playLandingVideo()">✨ 纹样AI动态化</button>
                    <video id="landing-video" class="ai-video hidden" controls playsinline style="width:100%; border-radius:8px; margin-top:10px;"></video>
                </div>
            </div>
            
            <div class="motif-description">
                <h3 style="color: #00897b; margin-top: 10px;">纹样介绍</h3>
                <p><strong>加载中...</strong></p>
                <p style="font-size: 0.95em; color: #666;">点击下方**【背景回望】**按钮查看详细历史介绍。</p>
            </div>
        </header>

        <div class="style-selector">
            <button onclick="showResult('minimalist')">极简抽象风</button>
            <button onclick="showResult('cyberpunk')">赛博朋克风</button>
            <button onclick="showResult('popart')">波普艺术风</button>
            <button onclick="showResult('guochao')">新国潮风</button>
            <button onclick="showHistory()" class="history-button">背景回望</button>
        </div>

        <div id="minimalist" class="result-display hidden">
            <button class="back-button" onclick="showSelector()">← 返回选择</button>
            <h2>极简抽象风</h2>
            <img src="" alt="极简抽象风" class="evolved-image"> 
            <div class="content-box">
                <h3>设计解读</h3>
                <p>将纹样提炼至最基本的几何线条，强调视觉张力。</p>
            </div>
        </div>

        <div id="cyberpunk" class="result-display hidden">
            <button class="back-button" onclick="showSelector()">← 返回选择</button>
            <h2>赛博朋克风</h2>
            <img src="" alt="赛博朋克风" class="evolved-image">
            <div class="content-box">
                <h3>设计解读</h3>
                <p>纹样结合霓虹色彩与数据流，呈现未来都市美学。</p>
            </div>
        </div>

        <div id="popart" class="result-display hidden">
            <button class="back-button" onclick="showSelector()">← 返回选择</button>
            <h2>波普艺术风</h2>
            <img src="" alt="波普艺术风" class="evolved-image">
            <div class="content-box">
                <h3>设计解读</h3>
                <p>大胆的高饱和撞色，将传统纹样转化为流行符号。</p>
            </div>
        </div>

        <div id="guochao" class="result-display hidden">
            <button class="back-button" onclick="showSelector()">← 返回选择</button>
            <h2>新国潮风</h2>
            <img src="" alt="新国潮风" class="evolved-image">
            <div class="content-box">
                <h3>设计解读</h3>
                <p>结合当代插画风格，强化中国红与金色的视觉冲击。</p>
            </div>
        </div>

        <div id="history-display" class="result-display hidden">
            <button class="back-button" onclick="showSelector()">← 返回选择</button>
            <h2>📜 纹样历史回望</h2>
            <div class="content-box">
                <img id="history-img" src="" alt="原始纹样图片" class="evolved-image">
                <h3>纹样溯源与背景</h3>
                <p id="history-text"></p>
            </div>
        </div>
    </div> 
    <script src="script.js"></script>
</body>
</html>
